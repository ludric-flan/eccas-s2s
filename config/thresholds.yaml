# =============================================================================
# Seuils des produits probabilistes
# =============================================================================
# Tous les seuils « climatologiques » sont des percentiles calculés PAR POINT DE
# GRILLE sur la normale observée 1991–2020 (décisions D12 et D13), recalculés
# sans l'année vérifiée pendant la validation croisée LOYO.
# =============================================================================

# Percentiles calculés à chaque maille, pour chaque échelle et chaque période.
percentiles: [5, 10, 20, 33.333333, 50, 66.666667, 80, 90, 95]
# Estimateur des percentiles sur 30 ans : position de Weibull i/(n+1)
# (numpy method="weibull"), sans biais pour les petits échantillons.
percentile_method: weibull
min_years_normal: 25        # années valides minimales pour calculer une normale

categories:
  terciles: [33.333333, 66.666667]  # BN | NN | AN
  quintiles_outer: [20, 80]    # P20 (très sec / très frais), P80 (très humide / très chaud)
  median: 50

precip:
  # Seuils absolus de cumul (mm) pour les cartes de dépassement.
  # Seuils arrêtés le 23/09/2026 après examen de la distribution observée
  # CHIRPS 1981–2026 sur le masque CEEAC (médianes : 27 mm par décade, 93 mm par
  # mois, 313 mm par saison). Les seuils précédents comportaient des événements
  # sans contenu : « ≥ 50 mm sur une saison » est vrai 75 % du temps.
  exceedance_mm:
    decade: [50, 75, 100]      # fortes pluies décadaires (32 %, 12 %, 4 % du temps)
    month:  [100, 200, 300]    # autour de la médiane puis fortes pluies (48 %, 17 %, 2 %)
    season: [300, 500, 600]    # médiane, saison humide, très humide (51 %, 25 %, 12 %)
  # Seuil d'anomalie (mm) pour le produit « anomalie seuil ».
  anomaly_mm: {decade: 15, month: 30, season: 60}
  # Masque de saison sèche appliqué aux produits (décision du 19/09/2026,
  # critère changé le 12/11/2026 pour celui de l'IRI, commun avec l'étude ENSO–CEEAC).
  # Une maille est masquée (« sèche ») pour une période quand, sur la normale
  # observée 1991–2020 de la maille :
  #   - method: iri      -> la pluie normale de la période est < iri_share_pct (15 %)
  #                         du total annuel normal OU < iri_floor_mm (30 mm), seuils
  #                         donnés pour 3 mois et mis à l'échelle de la durée
  #                         (1/3 pour un mois, jours/91,3 pour une décade) ;
  #                         Wilks & Godfrey (2002) : « <15% of the annual
  #                         climatological precipitation in that season » ;
  #   - method: relative -> la pluie normale de la période est < relative_fraction
  #                         × part au prorata du total annuel (ancien défaut) ;
  #   - method: absolute -> la pluie PRÉVUE est < absolute_mm[échelle].
  # La méthode peut être changée à l'exécution (--dry-mask).
  dry_mask:
    method: iri
    iri_share_pct: 15
    iri_floor_mm: 30
    relative_fraction: 0.15
    absolute_mm: {decade: 5, month: 15, season: 45}
  wet_day_mm: 1.0              # définition d'un jour de pluie

temperature:
  # Percentiles extrêmes par maille (décision D13).
  tmax_hot: [90, 95]           # chaleur diurne extrême
  tmin_warm: [90, 95]          # nuits chaudes
  tmin_cold: [10, 5]           # nuits froides
  t2m_outer: [20, 80]          # période anormalement fraîche / chaude
